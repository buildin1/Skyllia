name: 构建并发布（Fork 专用）

on:
  push:
    branches:
      - ver/3.x
  workflow_dispatch: {}

permissions: write-all

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    if: "!contains(github.event.head_commit.message, '[ci-skip]')"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          cache: "gradle"
          distribution: "temurin"

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 编译 Skyllia 主插件与全部 addon
        run: |
          echo "开始编译 Skyllia 主插件与所有 addon（shadowJar）..."
          ./gradlew shadowJar
          echo "编译完成。"

      - name: 收集构建产物
        run: |
          echo "正在收集编译好的 jar 文件..."
          mkdir -p release
          cp build/libs/*.jar release/ || true
          cp addons/*/build/libs/*.jar release/ || true
          rm -f release/addons-*.jar
          echo "本次构建产物："
          ls -la release/

      - name: 上传构建产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: Skyllia-Build-${{ github.run_number }}
          path: release/*.jar

      - name: 整理提交记录（用于发布说明）
        env:
          COMMITS_JSON: ${{ toJSON(github.event.commits.*.message) }}
        run: |
          echo "正在整理本次推送的提交记录..."
          delimiter="COMMITS_EOF_$(date +%s%N)"
          {
            echo "commit_msg<<$delimiter"
            echo "$COMMITS_JSON" | jq -r 'reverse | .[] | "- " + .'
            echo "$delimiter"
          } >> "$GITHUB_ENV"

      - name: 创建 GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: fork-build-${{ github.run_number }}
          name: Skyllia（Fork 构建）#${{ github.run_number }}
          body: |
            本次发布由 GitHub Actions 自动编译产出（buildin1/Skyllia fork，基于 WindsorMacmillan/Skyllia 的 ver/3.x 分支）。

            ### 本次提交记录
            ${{ env.commit_msg }}
          artifacts: release/*.jar
          generateReleaseNotes: false
          prerelease: false
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
          replacesArtifacts: false

      - name: 完成
        run: echo "本次构建与发布流程已全部完成。"
