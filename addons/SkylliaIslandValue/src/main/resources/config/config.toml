[island-level]
# Mathematical formula to calculate the level from the score.
# Available variables: score, level, size
# Available functions: FLOOR, SQRT, CEIL, ABS, POW, LOG, MIN, MAX, ...
level-expression = "FLOOR(SQRT(score / 10))"

# Minimum guaranteed level (no island can drop below this)
min-level = 0

# Interval (in seconds) between two automatic scans of online islands
timer-interval-seconds = 300

# Cache validity duration for the Top leaderboard (in seconds)
timer-interval-seconds-top = 120

[blocks]
# Assign each block type a value (positive decimal number)
# Use Bukkit names in UPPERCASE
DIRT = 1
GRASS_BLOCK = 2
STONE = 3

[scan-notification]
# Type: BOSS_BAR, TITLE, ACTION_BAR, NONE
type = "BOSS_BAR"
boss-bar-color = "YELLOW"

# How many chunks to process between each progress notification update.
# Higher = less frequent updates, lower CPU overhead from translations.
# Min: 1 (update after every chunk). Recommended: 5–10.
update-every-chunks = 5

[scan-processing]
# Number of threads used to schedule chunk load requests.
# -1 = auto (max(4, availableProcessors / 8))
# Increase if many islands are scanned simultaneously.
scheduler-threads = -1

# Number of threads used to compute block scores after a chunk is loaded.
# -1 = auto (max(4, availableProcessors / 8))
# Increase if scoring is the bottleneck (CPU-bound step).
# Keep lower than scheduler-threads if your server is CPU-constrained.
scorer-threads = -1

# Delay in milliseconds between each chunk load request within a single island scan.
# Higher values reduce CPU/IO bursts but make scans slower.
# Recommended: 20–100 ms. Set to 0 to disable throttling (not recommended).
delay-ms = 50