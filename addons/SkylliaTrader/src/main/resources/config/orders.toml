# ═══════════════════════════════════════════════════════════════════════════
# SkylliaTrader 商队订单表
# ═══════════════════════════════════════════════════════════════════════════
# 每一条 [[order]] 都是一条显式配置的订单，不是靠公式批量生成的——
# 每种材料该给多少声望、该开多高门槛，都需要人工权衡，写成公式反而容易失控。
#
# ── 两种类型的共同点 ──────────────────────────────────────────────────────
# 不论哪种 type，"岛屿要交出去什么"一律写在 take-items 里（material + amount 的列表，
# 最多 4 组）。take-items 决定了"完成一单"到底是什么，因此**不能为空**：
# 空的 take-items 等于"什么都不用交就能领走奖励和声望"，而声望是不能用钱替代的稀缺资源。
# 加载时如果 take-items 为空、或者里面任何一项的材料名拼写错误，整条订单会被丢弃并报 error
# ——宁可这条订单不出现，也不能加载一条半残的订单。
#
# ── 两种 type 的区别只在"商队怎么付账" ───────────────────────────────────
#   "money"  —— 商队支付 Vault 金币。
#                price = **完成这一整单支付的总金额，不是单价**。
#                比如 take-items 写 64 个圆石、price 写 6，就是"交 64 圆石得 6 金币"，
#                不会再拿 6 去乘数量。想调价直接改 price 这一个数即可。
#   "barter" —— 商队支付 give-items 里的物品（最多 4 组），不涉及金币，give-items 不能为空。
#
# 两种 type 都可以额外配 reward-reputation（不小于 0）：
# 填 0 就是"纯交易不换声望"，填大于 0 就是"顺带换声望"。
#
# ── 其余字段 ──────────────────────────────────────────────────────────────
# id：订单唯一标识。比较时会**去掉首尾空白并转成小写**，所以 "Iron-Buy" 和 "iron-buy"
#     算同一个 id；重复的 id 会被丢弃并报 error（重复 id 会让两条订单共用同一个限购计数器，
#     做满一条另一条也跟着锁死）。
#
# redeem-limit-per-island：这条订单在同一座岛屿"终身"最多能完成**几单**，0 = 不限。
# 注意这个计数器是挂在岛屿维度的，不是玩家维度——同一座岛换人来交易也不会刷新次数，
# 这是防止"退出小队再加入"刷单的生命线，不能改成按玩家计数。
#
# ⚠️ 2026-08-26 变更：money 类型订单的终身限购全部改回 0（不限），只有 barter 订单保留。
#
# 原因（工单反馈 + 复查）：这个字段是 2026-08-21 审查时加的，当时的理由是"声望没有衰减、
# 也没有每日/每周上限，只靠 3 个槽位 + 6 小时换单挡不住连点刷声望"。但同一次审查还补了
# 另外一道闸门——order-board.daily-reputation-cap（每日声望上限）——才是真正锁死产出速率的
# 东西。DailyOrderReputation 的类文档自己写得很清楚："终身限购那次修复只是把'无限'改成
# '一个偏宽松的有限值'，不是真正锁定产出速率"。也就是说终身限购从一开始就是冗余的第三道锁。
#
# 而这道冗余的锁有真实代价：每日额度用尽后继续提交，材料被扣、金币和声望都是 0，终身限购
# 次数却照样 -1，那一次次数永远拿不回来——被 bug 烧过次数的岛屿，声望上限会真的比别的岛低。
# 结算侧现在已经加了"零收益直接拒绝并退还材料"（见 OrderBoardService#computeSettlement），
# 但只要终身限购还在，历史损失就补不回来，公平性问题也修不干净。改成 0 之后：
#   · 每日声望上限 200 依旧生效 → 到 3000 顶格档位最少仍要 15 天，速率完全没变
#   · 每日金币上限 800 依旧生效（盖住最大一单 650，仍低于打工日均 1500）
#   · 被烧过次数的老岛自动痊愈，不需要写数据迁移脚本
#
# ⚠️ barter 订单（bone-for-emerald）必须保留正数，不能跟着改成 0：它付的是物品不是金币，
# 注释里写明了"不受每日订单货币收入上限约束"，声望上限也管不到物品产出——终身限购是它
# 唯一的产出闸门。取消的话，30 秒冷却下一个 6 小时窗口能刷 720 次 = 5760 个绿宝石，
# 变成无限绿宝石生成器。要放开必须先给 barter 补一个每日兑换次数上限。
#
# weight：自然刷新时的抽取权重，最小 1。本表按"档位越低权重越高"设计：
# 小额档 8-10（常见），中额档 4-6（较常见），大额档 2-4（少见），
# 体现 HANDOFF 6.4 "低档常见、高档稀有" 的刷新分布预期。
#
# required-level-min / required-reputation-min：解锁这条订单需要的岛屿等级/商会声望门槛，
# 对齐 config.toml 里 [track.island-level] / [track.reputation] 的档位设计。
#
# ═══════════════════════════════════════════════════════════════════════════
# 定价锚点（2026-08-28：PlayerTask 日均约 1500 + 订单收购）
# ═══════════════════════════════════════════════════════════════════════════
# 金币约 ×10、声望 ×3，每日金币上限 800（盖住金块 650）。声望日上限仍 200。
# 沙砾收购已删：商店砂砾 0.3 不限购，再收会倒挂。
#
#   档位   材料池              货币范围     声望
#   小额   圆石/原木/小麦       50-80       +15
#   中额   石砖/木板/羊毛/铜/面包 150-250    +40
#   大额   铁块/金块/末影珍珠    450-650    +80
#
# 商店粗铁 8 / 粗金 12 / 粗铜 8，均高于对应订单折算单价，买矿交单印不了钞。

config-version = 1

# ═══════════════════════════════════════════════════════════════════════════
# 小额档（圆石/原木/小麦，声望 +15，人人可做）
# ═══════════════════════════════════════════════════════════════════════════

[[order]]
id = "cobblestone-buy"
enabled = true
display-name = "<gray>圆石收购"
type = "money"

# 交 128 个圆石，商队支付 60 金币（整单总价）
take-items = [
    { material = "COBBLESTONE", amount = 128 },
]
price = 60.0

reward-reputation = 15
weight = 10
redeem-limit-per-island = 0
required-level-min = 0
required-reputation-min = 0

[[order]]
id = "oak-log-buy"
enabled = true
display-name = "<gold>原木收购"
type = "money"

# 交 64 个橡木原木，商队支付 80 金币——初始只有橡木树苗（HANDOFF 9.1），
# 这条订单对第一天的新岛屿就是可做的，不依赖其它树种。
take-items = [
    { material = "OAK_LOG", amount = 64 },
]
price = 80.0

reward-reputation = 15
weight = 9
redeem-limit-per-island = 0
required-level-min = 0
required-reputation-min = 0

[[order]]
id = "wheat-buy"
enabled = true
display-name = "<yellow>小麦收购"
type = "money"

# 交 96 捆小麦，商队支付 50 金币（本表价格最低的一条，小麦是最容易量产的农作物）
take-items = [
    { material = "WHEAT", amount = 96 },
]
price = 50.0

reward-reputation = 15
weight = 10
redeem-limit-per-island = 0
required-level-min = 0
required-reputation-min = 0


