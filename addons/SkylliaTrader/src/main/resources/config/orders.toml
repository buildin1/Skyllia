enabled = true
display-name = "<aqua>骨头兑换绿宝石"
type = "barter"

# 纯物物交换，不涉及金币：交 32 根骨头，商队支付 8 个绿宝石。
# 骨头对齐大额档材料池（刷怪场产物），但不涉及货币，不受每日订单货币收入上限约束——
# 声望给得比同档 money 订单低（+10 而不是 +80），因为绿宝石本身也是有价值的回报。
take-items = [
    { material = "BONE", amount = 32 },
]
give-items = [
    { material = "EMERALD", amount = 8 },
]

reward-reputation = 10
weight = 2
redeem-limit-per-island = 50
required-level-min = 10
required-reputation-min = 0
