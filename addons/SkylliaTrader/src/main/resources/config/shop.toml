# ═══════════════════════════════════════════════════════════════════════════
# SkylliaTrader 商店商品表
# ═══════════════════════════════════════════════════════════════════════════
# 每一条 [[shop-item]] 都是显式配置的商品，不是靠公式批量生成——参照 orders.toml 的规矩。
# 定价以公开百科（PlayerTask 日均产出 ~100 的新锚点）为准，改价格两边要一起改，见 HANDOFF.md 9.3。
#
# ── 字段说明 ────────────────────────────────────────────────────────────
# id                     商品唯一标识。比较时会去掉首尾空白并转成小写，重复的 id 会被丢弃并报 error。
# material               Bukkit Material 枚举名。
# display-name           MiniMessage 格式的展示名。
# price                  基础单价（未打折前），Vault 金币。
# unlock-track           解锁轨道：TRADE_COUNT / ISLAND_LEVEL / REPUTATION 三选一。
# unlock-tier            该轨道要求达到的档位数值（不是档位下标，是原始数字，
#                        比如交易次数轨的 0/10/25/50/100、岛屿等级轨的 1/5/10/15/20/30、
#                        商会声望轨的 0/100/300/700/1500/3000，要和 config.toml 的
#                        [track.*] 档位表对应）。
# natural-visible        是否也在"自然刷新的路人商人"货架上出现。只有交易次数轨第 0 档的
#                        商品才应该是 true——路人商人只卖基础生活池，逼玩家去挑战任务换凭证。
# purchase-limit-period  限购周期：NONE（不限购）/ DAILY / WEEKLY / MONTHLY / LIFETIME（终身）。
#                        全部按"滚动窗口"判定，不对齐自然日/自然周，避免时区/月份天数的复杂度。
# purchase-limit-count   该周期内每岛限购的数量；purchase-limit-period = NONE 时忽略此字段。
# extra-gate             可选。目前只有一个取值 "NETHERITE_INGOT_DUAL"，表示这条商品除了
#                        unlock-track/unlock-tier 之外，还要求岛屿等级 ≥45（硬编码在
#                        ShopPurchaseService 里，见 HANDOFF.md 9.3 的 T6 双轨门槛）。
#                        其余商品不填这个字段（单轨判定）。
# caravan                可选。专供商队：OVERWORLD / NETHER / END。写了就只出现在该种商队
#                        （凭证游商）的货架上，留空 = 所有商队通卖。这是货架划分不是安全
#                        边界——解锁与限购判定照常走 unlock-track 等字段。
#
# ⚠️ 钻石（id = "diamond"）的 purchase-limit-count 只是文档占位值：真实限购数字按岛屿等级
#    动态决定（<20 级=1，20-29 级=3，≥30 级=10），运行时由代码按 Material.DIAMOND 特判覆盖，
#    不读这个字段。这是 HANDOFF 9.3 明确要求"不要在这里直接写死一个数字"的唯一例外项。

config-version = 1

