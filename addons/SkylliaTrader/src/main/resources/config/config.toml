# ═══════════════════════════════════════════════════════════════════════════
# SkylliaTrader 全局配置
# ═══════════════════════════════════════════════════════════════════════════
# 游商是稀缺资源进服的唯一入口，解锁靠四条互不可替代的轨道：
#   1. 交易次数 —— 开基础生活物资池
#   2. 岛屿等级 —— 开建材大宗
#   3. 商会声望 —— 开钻石/下界合金/下界之星等稀有物资（只能靠商队订单赚，不能拿钱或等级替代）
#   4. 累计消费 —— 只给折扣和限购加成，不解锁新商品
# 具体"哪个档位能买什么"由 orders.toml 以及未来的商店商品表决定，这里只维护档位数值本身。

# 结构版本。
#   1 = 首个发布版本：四轨档位表、三种商队、凭证识别规则、自然刷新、说明书
#       （没有过 config-version 2，1 会被直接迁到 3）
#   3 = merchant-spawn.max-spawn-attempts 改成「0 = 自动按扫描半径取满」，
#       并对停在旧默认值 10 上的存量配置自动迁移一次（控制台会打一条 warn 说明）
config-version = 3

# ─────────────────────────────────────────────────────────────────────────
# 四轨档位表
# ─────────────────────────────────────────────────────────────────────────

[track.trade-count]
# 累计交易次数达到以下档位时，解锁对应档位的基础生活物资池。
# 数组必须从小到大排列（写乱了插件会自动排序并在控制台警告，但请以配置文件为准修正）。第 0 档（数值 0）代表"从进服第一次交易起就能买"——
# 沙子、甘蔗、烈焰棒、下界疣这四种"断链材料"必须能配置在第 0 档，
# 所以这里不会把"次数门槛 = 0"当成特殊情况处理不了，0 就是普通的第一个数组元素。
tiers = [0, 10, 25, 50, 100]

[track.island-level]
# 岛屿等级达到以下档位时，解锁对应档位的建材大宗商品。
# 岛屿等级由 SkylliaIslandLevel 附属插件计算；如果服务器没有安装该插件，
# 本轨会一直视为 0 级（见 bridge.IslandLevelBridge 的说明），不会报错，只是这条轨道打不开。
tiers = [1, 5, 10, 15, 20, 30]

[track.reputation]
# 商会声望达到以下档位时，解锁对应档位的稀有物资（钻石/下界合金/下界之星等）。
# 声望只能通过完成商队订单赚取，任何情况下都不能用金钱或岛屿等级替代——
# 这是防止"氪金/堆等级"绕过资源投放节奏的核心设计，改动前务必想清楚。
tiers = [0, 100, 300, 700, 1500, 3000]

[track.spending]
# 累计消费（花在游商商店购买上的 Vault 金额）达到以下档位时，
# 只提升折扣力度与限购数量加成，不会解锁任何新商品——避免"氪金变强"。
# 具体折扣百分比/限购加成数值由 T3 阶段（购买事务）实现并读取这张表，
# T1 只落地档位数值本身。
tiers = [0.0, 1000.0, 5000.0, 20000.0, 100000.0]

# ─────────────────────────────────────────────────────────────────────────
# 商队凭证 / 召唤名额
# ─────────────────────────────────────────────────────────────────────────
# 三种商队：主世界 / 下界 / 末地，各对应一张凭证。
# 凭证是【一次性解锁道具】：用掉一张换来一个【永久常驻】在岛上的商人，商人不会自己消失，
# 但可以被杀死，死后能用新凭证重新召唤。

[credential]
# 【主判定】每座岛屿「每种商队」最多能同时拥有几个常驻商人。
# 规格是 1：三种商队（主世界 / 下界 / 末地）各一张凭证、各最多 1 个商人，
# 所以一座岛最多 3 个常驻商人。已经有了之后，其他成员再用同种凭证会失败，
# 并且【凭证不会被消耗】。
#
# ⚠️ 这一项和下面的 max-merchants-per-island 是【两条独立的上限，同时满足才能召唤】：
#    · max-per-caravan            管「同一种商队不能有第二个」
#    · max-merchants-per-island   管「三种加起来不能超过几个」
#    只有总数上限的话，连用三张主世界凭证就能占满名额，下界/末地永远召不出来 —— 那不是规格要的。
max-per-caravan = 1

# 【总名额上限】每座岛屿三种商队加起来最多几个常驻商人。
# 默认 3 = 三种各 1 个，等于这条上限不生效；调成 2 就表示这座岛只能同时留 2 个常驻商人，
# 至于留哪两种由玩家自己选。
#
# 凭证是一次性解锁位，不是消耗品：召唤出的游商被击杀后，名额会释放、
# 可以用新凭证重新召唤，名额总量不会因为游商死亡而减少，也不会随时间被消耗掉。
#
# 这是**全服默认值**。T4 会加入「按岛发放/回收凭证」的管理功能，被单独调整过的岛屿
# 用它自己记录的槽位数（存在岛屿数据的 credentialSlots 字段里），没被单独调整过的岛屿
# （字段为 -1，表示未初始化）一律回退到这里的数值。
max-merchants-per-island = 3

# 岛上的游商被杀死后，对应的名额是否自动释放、允许重新召唤。
# 关掉的话，死亡的游商名额会一直占着，需要管理员用
#   /skylliadmin trader release <玩家> <商队>
# 手动释放（一般不建议关闭）。
respawn-on-death = true

# 游商死亡后到允许重新召唤之间的冷却时间（秒）。0 表示不限制、随时可召唤。
# 这个值是为了防止玩家靠「故意打死自己岛上的游商再重新召唤」来刷新订单/规避限购。
# 冷却记在岛屿维度（岛屿数据的 lastMerchantDeathAt 字段）：岛上任何一个游商死亡都会
# 触发整座岛的冷却，而不是只锁住死掉的那一个名额。
respawn-cooldown-seconds = 300

# 【CAS 占位超时】（秒）
# 召唤的顺序是「先在数据库里占住名额 → 生成实体成功 → 才扣凭证」，任何一步失败都会回滚占位。
# 但如果服务器恰好在「占位已写入、实体还没生成完」的那一瞬间崩溃/被强杀，
# 那条占位记录就会永远躺在数据库里，把这座岛的该商队名额锁死 ——
# 表现为「凭证怎么用都提示已有商人，但岛上一个商人都没有」。
# 超过这个秒数的占位会被下一次召唤视为空位直接顶掉，是防这种情况的唯一手段。
#
# ⚠️ 不要调得太小：小于一次「加载区块 + 扫描落点 + 生成实体」所需的时间，
#    正常召唤会在自己的占位过期之后才转正，并发保护就形同虚设。最小值 5，低于 5 会被夹到 5。
claim-timeout-seconds = 30

# 【召唤世界】三种商队都在主岛召唤 —— 下界和末地都是虚空，玩家几乎不会去，
# 让玩家跑过去召唤等于那两种商队永远用不上。
# 留空（默认）表示自动取第一个 environment = NORMAL 的空岛世界，一般不需要改。
# 只有当你的服务器注册了多个 NORMAL 世界、且主岛不是第一个时，才需要在这里写死世界名。
summon-world = ""

# ─────────────────────────────────────────────────────────────────────────
# 凭证物品的识别规则
# ─────────────────────────────────────────────────────────────────────────
# 凭证的【正式来源是挑战任务奖励】：SkylliaChallenge 的 ItemReward 支持 custom-model-data，
# 在挑战奖励里配一个同样材质 + 同样 CMD 的物品即可，不需要写任何代码。
# /skylliadmin trader credential <商队> 可以拿一张样品出来对模型、试右键。
#
# 识别只看【材质 + custom-model-data】两项，不看名字和 lore ——
# 否则玩家用铁砧改个名字就能伪造凭证。
#
# · material          留空表示只看 CMD 不看材质（不推荐：任何带同样 CMD 的物品都会被吃掉）
# · custom-model-data 必须【三种各不相同】，撞了的会被自动停用并在控制台报 error
# · display-name      只用在样品上（MiniMessage），不参与识别

[credential.item.overworld]
material = "PAPER"
custom-model-data = 90001
display-name = "<gold>主世界商队凭证"

[credential.item.nether]
material = "PAPER"
custom-model-data = 90002
display-name = "<red>下界商队凭证"

[credential.item.end]
material = "PAPER"
custom-model-data = 90003
display-name = "<light_purple>末地商队凭证"

# ─────────────────────────────────────────────────────────────────────────
# 游商的显示名
# ─────────────────────────────────────────────────────────────────────────
# 顶在游商头上的名字（MiniMessage）。让玩家一眼看出是哪种商队，
# 也和路过的原版游商区分开。

[merchant.display-name]
overworld = "<green>主世界商队"
nether = "<red>下界商队"
end = "<light_purple>末地商队"
# 自然刷新出来的临时游商用这个名字。
natural = "<gray>流浪游商"

# ─────────────────────────────────────────────────────────────────────────
# 自然刷新
# ─────────────────────────────────────────────────────────────────────────
# 岛上【确实站着一名成员】时，按概率在岛屿 spawn 附近刷出一个【临时】游商，
# 停留若干分钟后离开。
#
# ⚠️ 判定口径是「人在岛上」，不是「岛屿有成员在线」。后者会让一个在主城挂机的玩家
#    把他那座空岛的 spawn 区块拽进内存、让 Folia 为它拉起一个区域开始 tick、
#    刷出一个没人看得见的商人 —— 69 座岛叠起来就是持续的无谓开销。
#    玩家坐标由玩家自己线程上的移动/传送/加入事件写进内存缓存，判定时只读缓存，
#    不读实体、不碰区块；传送是在【传送发生之前】就记下目标坐标的，
#    所以不会出现「刚传送回岛就判定失败」。
#
# 和凭证游商的区别：
#   · 自然刷新的游商【不占凭证名额】
#   · 只开放「交易次数」轨的基础档（见 max-trade-count-tier），额外卖一本说明书
#   · 【尊重】岛主的 skyllia:island.spawn.passive.wandering_villager 标志（凭证召唤无视）
#
# ⚠️ 下界与末地都是虚空世界，自然刷新事实上不会在那两个世界触发 —— 这是已知且可接受的：
#    三种商队都靠凭证在主岛召唤，不依赖玩家跑去虚空世界。

[natural-spawn]
# 总开关。关掉之后只剩凭证召唤这一条路。
enabled = true

# 巡检间隔（秒）：每隔这么久遍历一遍「有成员在线的岛屿」，各掷一次骰子。
# ⚠️ 这一项在【启动时】读一次就固定了，/skyllia reload 改不了巡检频率，需要重启；
#    下面的概率/停留/冷却都是每次判定时现读的，reload 立即生效。
# 最小值 5，低于 5 会被夹到 5。
check-interval-seconds = 60

# 每次巡检时，单座岛刷出游商的概率（0.0 ~ 1.0）。
# 按默认值算：60 秒一次 × 5% ≈ 平均 20 分钟一个，再叠加下面的冷却。
chance = 0.05

# 刷出来的游商在岛上停留多少分钟后离开。
stay-minutes = 10

# 一座岛两次自然刷新之间的最短间隔（分钟）。
# 注意：【没中概率也会走这个冷却】，否则「间隔 + 概率」两个旋钮里的间隔那个就等于没有了。
cooldown-minutes = 30

# 自然刷新的游商最多开放到「交易次数」轨的第几档（0 = 只有第 0 档那批基础生活物资：
# 沙、甘蔗、烈焰棒、下界疣、种子、树苗……）。
# 这是刻意的：如果路过的野生游商什么都卖，玩家就没有理由去做挑战任务换凭证了。
max-trade-count-tier = 0

# 是否尊重岛主的 skyllia:island.spawn.passive.wandering_villager 标志
# （或 skyllia:island.spawn.passive.all 兜底标志）。
# 岛主在 /is flag 里关掉游商生成，就不该在他岛上刷 —— 默认 true，一般不要改。
# 凭证召唤【永远】无视这个标志：玩家付出了凭证，就该拿到商人。
respect-island-flag = true

# ─────────────────────────────────────────────────────────────────────────
# 说明书（自然刷新游商的额外商品）
# ─────────────────────────────────────────────────────────────────────────
# 自然刷新的游商除了基础池，还会额外上架这一本说明书，作用是【新手引导】：
# 告诉玩家凭证从哪来、怎么召唤进阶商队、四条轨道分别怎么提升、能解锁什么。
# 这套系统有四条解锁维度，不写清楚玩家根本猜不出来怎么玩。
#
# ⚠️ 当前阶段【还没有购买入口】：商店购买 GUI 与扣款发货事务属于下一阶段，
#    在那之前玩家买不到这本书。管理员可以用 /skylliadmin trader guidebook 拿一本样品校对文案。
#
# 整本书的文案都在配置里，改完 /skyllia reload 立即生效，不需要改代码。

[guidebook]
enabled = true

# 书的材质。只有 WRITTEN_BOOK（成书）能翻页显示多页文案；
# 换成别的材质时会降级成「名字 + lore」，内容还在，但要靠鼠标悬停看。
material = "WRITTEN_BOOK"

# 书名（MiniMessage）。注意成书的书名栏不显示颜色，颜色标记会被客户端忽略。
title = "<gold>游商指南"

# 作者名（纯文本，成书的作者栏不吃富文本）。
author = "空岛商会"

# 售价（Vault 金币）。【刻意压得很低】—— 它是新手引导，不是收入来源，
# 买不起说明书的新手正是最需要它的人。服主已确认日均货币产出约 1000，30 约等于日收入的 3%。
price = 30.0

# 限购次数，0 = 不限购。说明书不限购：书会掉、会被误丢，重新买一本不该被拦。
purchase-limit = 0

# 每一页的正文（MiniMessage）。一页放不下会被客户端截断，请自己分页。
# 数组里的每一个元素就是一页，元素内部用 \n 换行（TOML 的转义换行）。
#
# ⚠️ 成书最多 100 页，超出的部分会被【静默丢弃】（服务端不会报错，也不会崩）。
#    写超了的话控制台会在加载时打一条 warn 提醒你。
pages = [
  "<b>游商指南</b>\n\n路过的游商只带基础货：沙子、甘蔗、烈焰棒、下界疣、种子和树苗。\n\n想买到建材、钻石、下界合金？往后翻。",
  "<b>一、常驻商队</b>\n\n完成挑战任务可以拿到<b>商队凭证</b>，一共三种：主世界、下界、末地。\n\n拿着凭证在自己岛上<b>右键</b>，就能召唤一个<b>永久常驻</b>的商队商人。",
  "<b>凭证的规矩</b>\n\n· 每座岛<b>每种商队各 1 个</b>\n· 已经有了再用凭证会失败，<b>凭证不会被扣掉</b>\n· 商人可以被打死，之后能用新凭证重召\n· 岛上所有成员共用这些商人",
  "<b>二、四条轨道</b>\n\n商人卖什么，由四条互不替代的轨道决定：\n\n1. 交易次数\n2. 岛屿等级\n3. 商会声望\n4. 累计消费",
  "<b>1. 交易次数</b>\n开基础生活物资：树苗、染料、花草、珊瑚、苔藓……买得越多开得越全。\n\n<b>2. 岛屿等级</b>\n开建材大宗：下界岩、凝灰岩、滴水石锥、朱砂族、硫磺族……量大价低。",
  "<b>3. 商会声望</b>\n开稀有物资：钻石、远古残骸、下界之星、鞘翅。\n\n声望<b>只能</b>靠完成商队订单获得，钱和等级都换不来。\n\n<b>4. 累计消费</b>\n只给折扣和限购加成，不解锁新商品。",
  "<b>三、限购</b>\n\n所有限购都按<b>整座岛</b>计算，不是按人头。\n\n多拉几个人进岛并不能多买钻石。\n\n<gray>输入 /is trader 可以随时查看四条轨道的当前进度。</gray>"
]

# ─────────────────────────────────────────────────────────────────────────
# 订单板
# ─────────────────────────────────────────────────────────────────────────

[order-board]
# 每座岛屿的游商同时展示几个商队订单槽位。
# T1 只用这个数值把每座岛屿的订单槽位数组占位补齐（内容都是空槽），
# 真正往槽位里按权重抽取 orders.toml 里的订单是 T2 自然刷新逻辑的工作。
slots-per-island = 3

# ─────────────────────────────────────────────────────────────────────────
# 虚空世界安全生成扫描
# ─────────────────────────────────────────────────────────────────────────

[merchant-spawn]
# 在虚空世界（空岛世界、末地等地面不连续的世界）里安全放置游商时，
# 以候选生成点为中心向四周扫描的水平半径（单位：方块）。
# 扫描范围内必须能找到足够大的一块实心地面，否则视为该候选点不安全，会换点重试。
#
# 半径 r 对应 (2r+1)² 个候选列：半径 3 = 7×7 = 49 列。
# ⚠️ 这个半径能不能真的搜满，取决于下面的 max-spawn-attempts —— 那一项如果写了一个
#    小于 (2r+1)² 的正数，实际有效半径会被压小，而这里写的数字看起来完全正常。
#    两项要一起看，详见 max-spawn-attempts 的说明。
safe-scan-radius-blocks = 3

# 候选生成点正上方要求的最小空气净空高度（单位：方块），
# 避免游商生成之后卡进方块里动弹不得、或者直接被判定压死。
min-clear-height-blocks = 3

# 最多尝试多少个候选【列】就放弃本次召唤，并提示操作的玩家稍后重试。
#
# 【0 = 自动】按上面的 safe-scan-radius-blocks 取满 (2r+1)² —— 半径 3 就是 49 列。
# 推荐保持 0，让它跟着半径走。
#
# ⚠️ 写一个小于 (2r+1)² 的正数，等于【偷偷把有效扫描半径改小】：
#    候选列是按「由近到远」的顺序试的，写 10 就只够试到 (0,0) + 半径 1 的一圈 + 半径 2 的
#    第一个点，有效半径不到 2，而上面 safe-scan-radius-blocks 写着 3。
#    玩家在岛屿出生点盖了房子 / 停了船（很常见）时会直接召唤失败，提示「清理出生点周围」，
#    而服主看配置以为已经搜过 7×7 了。检测到这种情况时控制台会打一条 warn。
#
# 另外：这一项挡不住「死循环」—— 候选列表本来就是一次性建出来的、长度天然等于 (2r+1)²，
#      真正的上界是【半径】而不是它。只有想在很大的半径下故意提前收手才需要写正数。
#
# ⚠️ 全部尝试都失败时的行为是【放弃】：
#    · 凭证召唤 —— 不消耗凭证，回滚占位，给玩家一句中文提示
#    · 自然刷新 —— 不消耗冷却，下一轮巡检还会再试
#    绝不会「退而求其次」在不安全的位置生成 —— 虚空世界里那等于让游商生成即坠出世界。
max-spawn-attempts = 0

# 以岛屿 spawn 的高度为基准，向上/向下各探测多少格来找地面。
# 扫描顺序是 y, y-1, y+1, y-2, y+2 …… 先向下，因为岛屿出生点通常被设在地面上方一点点。
#
# ⚠️ 这一整套「以 island.getSpawnLocation() 为基准做有限范围扫描」的做法不能换成
#    world.getHighestBlockYAt()：空岛世界是虚空，那个方法在没有方块的列上返回世界最低高度
#    （-64），游商会在 y=-64 凭空出现然后自由落体消失 —— 玩家看到的是
#    「用了凭证，商人没了，凭证也没了」。
vertical-scan-range-blocks = 8
